name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci --legacy-peer-deps

      - name: Build frontend (Base Mainnet 8453)
        env:
          VITE_NETWORK: mainnet
          VITE_CONTRACT_ADDRESS: 0xB5467c3189907428a7feD5F7cb6C084AE8d743B2
          VITE_MODERATION_MODULE_ADDRESS: 0xc25e0a5d32ded38ae39ebdae9323287460bf7426
          VITE_COUNCIL_SAFE_ADDRESS: 0x4C28A82cAafdaD1B8AfbC9d7aBF3a411fE2a768c
          VITE_WC_PROJECT_ID: ${{ secrets.VITE_WC_PROJECT_ID }}
        run: cd frontend && npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
